# ci-backend.yml — NeuroAssist AI Backend CI
#
# What this workflow guarantees:
#   1. Every push/PR starts from a FRESH CLONE — the defect that kept 61 outbound
#      ports out of version control (unanchored "out/" in .gitignore) would have been
#      caught here: `./gradlew build` compiles only what the git index contains.
#   2. ArchUnit hexagonal-boundary rules pass for all 7 services that register the task.
#   3. Real Testcontainers integration tests pass for gest-service (the only service
#      whose integrationTest task uses Testcontainers/PostgreSQL, not a delegate).
#   4. An explicit canary verifies that a new file placed in application/port/out/
#      would NOT be gitignored — catching any future regression of the out/ pattern.
#
# Services and tasks verified (as of E2E-027):
#
#   architectureCheck registered:
#     acs-service, dash-service, edge-service, evnt-service, gest-service, hist-service, pac-service
#
#   architectureCheck NOT registered (ArchUnit in :test or not present):
#     neuroassist-ai-api-gateway, neuroassist-ai-migrations, neuroassist-ai-service-registry
#
#   integrationTest with real Docker/Testcontainers:
#     gest-service  (includes @Tag("integration") tests + bddTest BDD suite)
#
#   integrationTest delegates to :test (no extra Docker step needed):
#     acs-service, edge-service
#
#   No integrationTest task:
#     dash-service, evnt-service, hist-service, pac-service,
#     neuroassist-ai-api-gateway, neuroassist-ai-migrations, neuroassist-ai-service-registry

name: CI — Backend

on:
  push:
    branches: [dev, dev/backend, release, prod]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [dev, release, prod]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build + ArchUnit
  # Compiles all services from the git index (fresh clone) and runs ArchUnit
  # on the 7 services that register the architectureCheck task.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-check:
    name: Build + architectureCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (fresh clone)
        uses: actions/checkout@v4
        # No fetch-depth override: default is a shallow clone (--depth=1),
        # which is fine for build/ArchUnit. The gitignore-guard job uses
        # fetch-depth: 0 because it may need history for git check-ignore.

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build all services
        run: ./gradlew build --no-daemon --parallel

      - name: Run architectureCheck (7 services)
        # Only the 7 business services register this task.
        # neuroassist-ai-migrations, neuroassist-ai-api-gateway and
        # neuroassist-ai-service-registry do not — verified in E2E-027.
        run: |
          ./gradlew \
            :services:acs-service:architectureCheck \
            :services:dash-service:architectureCheck \
            :services:edge-service:architectureCheck \
            :services:evnt-service:architectureCheck \
            :services:gest-service:architectureCheck \
            :services:hist-service:architectureCheck \
            :services:pac-service:architectureCheck \
            --no-daemon

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Integration Tests (Docker/Testcontainers)
  # ubuntu-latest provides Docker out of the box.
  # Only gest-service has a real Testcontainers-based integrationTest task.
  # acs-service and edge-service delegate integrationTest → test (already covered
  # by the build-and-check job above).
  # ─────────────────────────────────────────────────────────────────────────────
  integration-test:
    name: integrationTest — gest-service (Testcontainers)
    runs-on: ubuntu-latest
    needs: build-and-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run gest-service integrationTest (PostgreSQL via Testcontainers)
        run: ./gradlew :services:gest-service:integrationTest --no-daemon

      - name: Run gest-service bddTest (Cucumber BDD suite via Testcontainers)
        # bddTest requires Docker (same Testcontainers PostgreSQL infra).
        # It is a separate task that runs CucumberIT.class via the JUnit Platform Suite Engine.
        run: ./gradlew :services:gest-service:bddTest --no-daemon

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — .gitignore guard for application/port/out/
  #
  # Root cause of the 61-ports defect: "out/" in .gitignore without a leading
  # slash matched application/port/out/ at any depth. The fix (anchoring to /out/)
  # is already in place, but this gate ensures no future edit reintroduces the
  # unanchored pattern.
  #
  # Strategy:
  #   a) Canary test — create a temporary file at a real application/port/out/ path
  #      and ask git whether it would be ignored. Fail if yes.
  #   b) Existing-file check — confirm no currently committed port/out Java file
  #      is silently gitignored (belt-and-suspenders; in a fresh clone this should
  #      always be clean, but the explicit check makes the intent undeniable).
  # ─────────────────────────────────────────────────────────────────────────────
  gitignore-guard:
    name: .gitignore guard — application/port/out/
    runs-on: ubuntu-latest
    # Runs independently — does not need build output; just git state.
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout (full history for git check-ignore accuracy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canary — verify new port/out file would NOT be gitignored
        shell: bash
        run: |
          CANARY="backend/services/gest-service/src/main/java/com/neuroassist/gest/application/port/out/CiGuard.java"
          mkdir -p "$(dirname "$CANARY")"
          printf '// ci-guard — temporary file created by gitignore-guard CI step\n' > "$CANARY"

          if git check-ignore -q "$CANARY"; then
            rm -f "$CANARY"
            echo "::error file=$CANARY::git would ignore '$CANARY'."
            echo "::error::A .gitignore pattern is matching application/port/out/ files."
            echo "::error::This replicates the defect that kept 61 outbound ports out of version control (E2E-027)."
            echo "::error::Check .gitignore for an unanchored 'out/' pattern — anchor it as '/out/' (leading slash)."
            exit 1
          fi

          rm -f "$CANARY"
          echo "OK: git would NOT ignore a new file at application/port/out/ — pattern is safe."

      - name: Existing files — none of the committed port/out/*.java files are gitignored
        shell: bash
        run: |
          # In a fresh clone only committed files exist, so --others returns nothing
          # useful. We use git check-ignore on each committed port/out file directly.
          FAILURES=()
          while IFS= read -r f; do
            if git check-ignore -q "$f" 2>/dev/null; then
              FAILURES+=("$f")
            fi
          done < <(git ls-files 'backend/services/*/src/main/java/**/application/port/out/*.java' 2>/dev/null)

          if [ ${#FAILURES[@]} -gt 0 ]; then
            echo "::error::The following tracked port/out files are being gitignored (should never happen):"
            for f in "${FAILURES[@]}"; do
              echo "  $f"
            done
            exit 1
          fi

          COUNT=$(git ls-files 'backend/services/*/src/main/java/**/application/port/out/*.java' 2>/dev/null | wc -l)
          echo "OK: $COUNT committed application/port/out/*.java file(s) — none are gitignored."
