<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroAssist AI — Estrutura do Projeto</title>
<style>
  :root {
    --bg:        #0D1117;
    --surface:   #161B22;
    --border:    #21262D;
    --muted:     #8B949E;
    --text:      #C9D1D9;
    --heading:   #E6EDF3;
    --accent:    #58A6FF;
    --accent-dim:#1F6FEB22;
    --c-java:    #F0883E;
    --c-ts:      #3178C6;
    --c-md:      #A371F7;
    --c-yaml:    #56D364;
    --c-py:      #FFD43B;
    --c-json:    #E3B341;
    --c-sql:     #F85149;
    --c-gradle:  #02B4E0;
    --c-folder:  #58A6FF;
    --c-other:   #8B949E;
    --radius:    6px;
    --mono:      'JetBrains Mono', 'Cascadia Code', 'Fira Code', ui-monospace, monospace;
    --sans:      system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#F6F8FA;--surface:#FFFFFF;--border:#D0D7DE;--muted:#656D76;
      --text:#24292F;--heading:#1F2328;--accent:#0969DA;--accent-dim:#0969DA14;
      --c-java:#D4522A;--c-ts:#0550AE;--c-md:#7C3AED;--c-yaml:#1A7F37;
      --c-py:#B45309;--c-json:#953800;--c-sql:#CF222E;--c-gradle:#0078A8;
      --c-folder:#0969DA;--c-other:#656D76;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0D1117;--surface:#161B22;--border:#21262D;--muted:#8B949E;
    --text:#C9D1D9;--heading:#E6EDF3;--accent:#58A6FF;--accent-dim:#1F6FEB22;
    --c-java:#F0883E;--c-ts:#3178C6;--c-md:#A371F7;--c-yaml:#56D364;
    --c-py:#FFD43B;--c-json:#E3B341;--c-sql:#F85149;--c-gradle:#02B4E0;
    --c-folder:#58A6FF;--c-other:#8B949E;
  }
  :root[data-theme="light"] {
    --bg:#F6F8FA;--surface:#FFFFFF;--border:#D0D7DE;--muted:#656D76;
    --text:#24292F;--heading:#1F2328;--accent:#0969DA;--accent-dim:#0969DA14;
    --c-java:#D4522A;--c-ts:#0550AE;--c-md:#7C3AED;--c-yaml:#1A7F37;
    --c-py:#B45309;--c-json:#953800;--c-sql:#CF222E;--c-gradle:#0078A8;
    --c-folder:#0969DA;--c-other:#656D76;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }
  .logo-mark {
    width: 30px; height: 30px;
    background: var(--accent);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .project-name { font-size: 14px; font-weight: 600; color: var(--heading); }
  .project-sub  { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
  .header-stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 3px 9px;
    font-size: 11px; font-family: var(--mono); color: var(--muted);
  }
  .stat b { color: var(--heading); }
  .header-controls { display: flex; gap: 8px; align-items: center; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  #search {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: var(--mono); font-size: 12px;
    padding: 5px 10px 5px 29px; width: 210px; outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }
  .btn {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--muted);
    cursor: pointer; font-size: 11px; font-family: var(--sans);
    padding: 5px 10px; transition: color .15s, border-color .15s;
  }
  .btn:hover { color: var(--heading); border-color: var(--accent); }
  .theme-btn { padding: 5px 8px; font-size: 13px; }

  .legend {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 7px 24px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  }
  .legend-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--mono); color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .tree-panel { padding: 14px 24px 40px; flex: 1; overflow-x: auto; }
  .tree-root { font-family: var(--mono); font-size: 12.5px; line-height: 1; min-width: max-content; }

  .node { display: flex; flex-direction: column; }
  .node-row {
    display: flex; align-items: center; height: 23px;
    cursor: default; border-radius: 4px; padding-right: 8px;
    user-select: none; transition: background .1s;
  }
  .node-row:hover { background: var(--accent-dim); }
  .node-row.highlighted { background: var(--accent-dim); outline: 1px solid var(--accent); }

  .indent { display: flex; align-items: stretch; flex-shrink: 0; }
  .guide { width: 16px; flex-shrink: 0; display: flex; align-items: stretch; justify-content: center; }
  .guide-line { width: 1px; background: var(--border); margin: 0 auto; }
  .connector { width: 16px; height: 23px; flex-shrink: 0; position: relative; }
  .connector::before { content:''; position:absolute; left:0; top:0; bottom:50%; width:1px; background:var(--border); }
  .connector::after  { content:''; position:absolute; left:0; top:50%; width:10px; height:1px; background:var(--border); }

  .toggle-btn {
    width: 18px; height: 18px; border: none; background: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    border-radius: 3px; color: var(--muted); flex-shrink: 0;
    transition: color .1s, background .1s; padding: 0;
  }
  .toggle-btn:hover { color: var(--heading); background: var(--border); }
  .toggle-btn svg { display: block; transition: transform .15s; }
  .toggle-btn.open svg { transform: rotate(90deg); }

  .file-icon { width: 16px; margin: 0 5px 0 3px; flex-shrink: 0; text-align: center; font-size: 11px; }

  .node-name { color: var(--text); white-space: nowrap; }
  .node-name.is-folder { color: var(--heading); font-weight: 500; }
  .node-name.java   { color: var(--c-java); }
  .node-name.ts     { color: var(--c-ts); }
  .node-name.md     { color: var(--c-md); }
  .node-name.yaml   { color: var(--c-yaml); }
  .node-name.py     { color: var(--c-py); }
  .node-name.json   { color: var(--c-json); }
  .node-name.sql    { color: var(--c-sql); }
  .node-name.gradle { color: var(--c-gradle); }

  .node-children { display: flex; flex-direction: column; }
  .node-children.collapsed { display: none; }

  .no-results { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 32px 0; text-align: center; display: none; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>

  return { name, type:'folder', children: [
    { name:'scripts', type:'folder', children:[{name:'init-db.sql'}] },

}

function feLib(name, features) {

}
function issues(prefix, n) {
  const arr = [];
  for (let i = 1; i <= n; i++) arr.push({name:`${prefix}-${String(i).padStart(3,'0')}.md`});
  return arr;

// ── File type detection ──────────────────────────────────
function fileClass(name) {
  if (!name) return '';
  if (/\.(java|java\.j2)$/.test(name)) return 'java';
  if (/\.(ts|tsx)$/.test(name)) return 'ts';
  if (/\.md$/.test(name)) return 'md';
  if (/\.(yml|yaml)$/.test(name)) return 'yaml';
  if (/\.py$/.test(name)) return 'py';
  if (/\.json(l)?$/.test(name)) return 'json';
  if (/\.sql$/.test(name)) return 'sql';
  if (/\.(gradle\.kts|gradle)$/.test(name)) return 'gradle';
  return '';
}
function fileIcon(node) {
  const isFolder = node.type === 'folder' || (node.children && node.children.length);
  if (isFolder) return '▸';
  const n = node.name || '';
  if (/\.(java|java\.j2)$/.test(n)) return '☕';
  if (/\.(ts|tsx)$/.test(n)) return 'TS';
  if (/\.md$/.test(n)) return '¶';
  if (/\.(yml|yaml)$/.test(n)) return '⚙';
  if (/\.py$/.test(n)) return 'Py';
  if (/\.json(l)?$/.test(n)) return '{}';
  if (/\.sql$/.test(n)) return 'DB';
  if (/\.gradle\.kts$/.test(n)) return 'GR';
  if (/\.feature$/.test(n)) return 'BDD';
  if (/\.html$/.test(n)) return '◇';
  if (n === 'gradlew' || n === 'gradlew.bat') return '$_';
  if (/\.j2$/.test(n)) return '◻';
  return '·';
}

// ── Build DOM ────────────────────────────────────────────
function buildNode(node, depth, isLast, guides) {
  const isFolder = node.type === 'folder' || (node.children && node.children.length > 0);
  const open = node.open !== false;

  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.name = (node.name || '').toLowerCase();

  const row = document.createElement('div');
  row.className = 'node-row';

  if (depth > 0) {
    const indent = document.createElement('div');
    indent.className = 'indent';
    for (let i = 0; i < depth - 1; i++) {
      const g = document.createElement('div');
      g.className = 'guide';
      if (guides && guides[i]) {
        const l = document.createElement('div');
        l.className = 'guide-line';
        g.appendChild(l);
      }
      indent.appendChild(g);
    }
    const conn = document.createElement('div');
    conn.className = 'connector' + (isLast ? ' last' : '');
    indent.appendChild(conn);
    row.appendChild(indent);
  }

  if (isFolder) {
    const btn = document.createElement('button');
    btn.className = 'toggle-btn' + (open ? ' open' : '');
    btn.setAttribute('aria-label', open ? 'recolher' : 'expandir');
    btn.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1.5l4 3.5-4 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const ch = el.querySelector('.node-children');
      const isOpen = btn.classList.toggle('open');
      ch.classList.toggle('collapsed', !isOpen);
    });
    row.appendChild(btn);
  } else {
    const sp = document.createElement('div');
    sp.style.cssText = 'width:18px;flex-shrink:0';
    row.appendChild(sp);
  }

  const icon = document.createElement('div');
  icon.className = 'file-icon';
  icon.textContent = fileIcon(node);
  if (isFolder) icon.style.color = 'var(--c-folder)';
  row.appendChild(icon);

  const nameEl = document.createElement('span');
  const fc = fileClass(node.name);
  nameEl.className = 'node-name' + (isFolder ? ' is-folder' : '') + (fc ? ' ' + fc : '');
  nameEl.textContent = node.name || '';
  row.appendChild(nameEl);
  el.appendChild(row);

  if (isFolder && node.children && node.children.length) {
    const ch = document.createElement('div');
    ch.className = 'node-children' + (!open ? ' collapsed' : '');
    const g2 = [...(guides || [])];
    g2.push(!isLast);
    node.children.forEach((child, i) => {
      ch.appendChild(buildNode(child, depth + 1, i === node.children.length - 1, g2));
    });
    el.appendChild(ch);
  }
  return el;
}

document.getElementById('treeRoot').appendChild(buildNode(TREE, 0, true, []));

// ── Search ───────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const noResults = document.getElementById('noResults');
  noResults.style.display = 'none';
  document.querySelectorAll('.node-row').forEach(r => r.classList.remove('highlighted'));

  if (!q) {
    document.querySelectorAll('.node').forEach(n => n.style.display = '');
    return;
  }
  let found = 0;
  document.querySelectorAll('.node').forEach(n => {
    const name = n.dataset.name || '';
    if (name.includes(q)) {
      n.style.display = '';
      n.querySelector('.node-row').classList.add('highlighted');
      found++;
      let p = n.parentElement;
      while (p && p.id !== 'treeRoot') {
        if (p.classList.contains('node-children')) p.classList.remove('collapsed');
        if (p.classList.contains('node')) p.style.display = '';
        p = p.parentElement;
      }
    } else {
      n.style.display = 'none';
    }
  });
  if (!found) {
    noResults.style.display = 'block';
    document.getElementById('noQuery').textContent = q;
  }
});

// ── Expand / Collapse all ────────────────────────────────
document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.classList.add('open');
    b.closest('.node').querySelector('.node-children')?.classList.remove('collapsed');
  });
});
document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.classList.remove('open');
    b.closest('.node').querySelector('.node-children')?.classList.add('collapsed');
  });
});

// ── Theme toggle ─────────────────────────────────────────
(function() {
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  let current = mq.matches ? 'dark' : 'light';
  root.dataset.theme = current;
  btn.addEventListener('click', () => {
    current = current === 'dark' ? 'light' : 'dark';
    root.dataset.theme = current;
  });
})();
