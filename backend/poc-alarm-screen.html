<title>NeuroAssist AI — Central de Alarme</title>
<style>
  /* ── Tokens ─────────────────────────────────────────────── */
  :root {
    --ground:        #0C0F14;
    --surface:       #141820;
    --text-hi:       #EAE8E3;
    --text-lo:       #6B6C72;
    --text-mid:      #A8A6A2;
    --calm-ground:   #091A12;
    --calm-glow:     #22C880;
    --calm-dim:      #0F2E1E;
    --alarm-ground:  #160404;
    --alarm-vivid:   #FF3B2F;
    --alarm-mid:     #C82820;
    --alarm-dim:     #2A0808;
    --confirm-color: #4A9EFF;
    --confirm-dark:  #1A5EBF;
    --amber:         #E8A030;
    --amber-dim:     #5A3C0A;
    --border-subtle: rgba(255,255,255,0.06);
    --trans-fast: 180ms ease;
    --trans-slow: 600ms cubic-bezier(0.4,0,0.2,1);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --ground:        #F0EEE9;
      --surface:       #FFFFFF;
      --text-hi:       #1C1A17;
      --text-lo:       #9A9894;
      --text-mid:      #5A5855;
      --calm-ground:   #EAF7F1;
      --calm-glow:     #178A52;
      --calm-dim:      #D0EDE0;
      --alarm-ground:  #FFF0EE;
      --alarm-vivid:   #C82014;
      --alarm-mid:     #E03020;
      --alarm-dim:     #FFD8D4;
      --confirm-color: #1A5EBF;
      --confirm-dark:  #0E3A7A;
      --amber:         #C07010;
      --amber-dim:     #FFF0CC;
      --border-subtle: rgba(0,0,0,0.08);
    }
  }

  :root[data-theme="dark"] {
    --ground:        #0C0F14;
    --surface:       #141820;
    --text-hi:       #EAE8E3;
    --text-lo:       #6B6C72;
    --text-mid:      #A8A6A2;
    --calm-ground:   #091A12;
    --calm-glow:     #22C880;
    --calm-dim:      #0F2E1E;
    --alarm-ground:  #160404;
    --alarm-vivid:   #FF3B2F;
    --alarm-mid:     #C82820;
    --alarm-dim:     #2A0808;
    --confirm-color: #4A9EFF;
    --confirm-dark:  #1A5EBF;
    --amber:         #E8A030;
    --amber-dim:     #5A3C0A;
    --border-subtle: rgba(255,255,255,0.06);
  }

  :root[data-theme="light"] {
    --ground:        #F0EEE9;
    --surface:       #FFFFFF;
    --text-hi:       #1C1A17;
    --text-lo:       #9A9894;
    --text-mid:      #5A5855;
    --calm-ground:   #EAF7F1;
    --calm-glow:     #178A52;
    --calm-dim:      #D0EDE0;
    --alarm-ground:  #FFF0EE;
    --alarm-vivid:   #C82014;
    --alarm-mid:     #E03020;
    --alarm-dim:     #FFD8D4;
    --confirm-color: #1A5EBF;
    --confirm-dark:  #0E3A7A;
    --amber:         #C07010;
    --amber-dim:     #FFF0CC;
    --border-subtle: rgba(0,0,0,0.08);
  }

  /* ── Reset ───────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--ground);
    color: var(--text-hi);
    overflow: hidden;
  }

  /* ── Stage — full viewport ───────────────────────────────── */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background var(--trans-slow);
    background: var(--ground);
  }

  /* ── IDLE state ──────────────────────────────────────────── */
  #stage.idle {
    background: var(--calm-ground);
  }

  .idle-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity var(--trans-slow), transform var(--trans-slow);
    pointer-events: none;
  }

  #stage.idle .idle-content {
    opacity: 1;
    transform: translateY(0);
  }

  .pulse-ring {
    position: relative;
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pulse-ring::before,
  .pulse-ring::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--calm-glow);
    animation: ring-pulse 2.4s ease-out infinite;
  }

  .pulse-ring::after {
    animation-delay: 1.2s;
  }

  @keyframes ring-pulse {
    0%   { transform: scale(1);   opacity: 0.8; }
    100% { transform: scale(2.4); opacity: 0;   }
  }

  .pulse-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--calm-glow);
    box-shadow: 0 0 16px var(--calm-glow);
  }

  .idle-label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--calm-glow);
  }

  .idle-status {
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--text-mid);
    letter-spacing: 0.01em;
  }

  .idle-name {
    font-size: 0.85rem;
    color: var(--text-lo);
    margin-top: -16px;
  }

  /* ── ALARM state ─────────────────────────────────────────── */
  #stage.alarm {
    background: var(--alarm-ground);
    animation: alarm-breathe 2s ease-in-out infinite;
  }

  @keyframes alarm-breathe {
    0%, 100% { background: var(--alarm-ground); }
    50%       { background: #200808; }
  }

  @media (prefers-reduced-motion: reduce) {
    #stage.alarm { animation: none; }
    .pulse-ring::before, .pulse-ring::after { animation: none; }
  }

  .alarm-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    opacity: 0;
    transform: scale(0.96);
    transition: opacity var(--trans-slow), transform var(--trans-slow);
    pointer-events: none;
    text-align: center;
    padding: 0 24px;
    max-width: 680px;
    width: 100%;
  }

  #stage.alarm .alarm-content {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  .alarm-eyebrow {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--alarm-vivid);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .alarm-eyebrow::before, .alarm-eyebrow::after {
    content: '';
    display: inline-block;
    width: 24px;
    height: 1px;
    background: var(--alarm-vivid);
    opacity: 0.6;
  }

  .alarm-verb {
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.03em;
    color: var(--text-hi);
    text-wrap: balance;
    margin-bottom: 12px;
  }

  .alarm-name {
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight: 300;
    color: var(--text-mid);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  .alarm-meta {
    display: flex;
    gap: 24px;
    margin-bottom: 44px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .meta-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 12px 20px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-subtle);
    min-width: 110px;
  }

  .meta-chip-label {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
  }

  .meta-chip-value {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-hi);
    font-variant-numeric: tabular-nums;
  }

  .confirm-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 18px 44px;
    border-radius: 6px;
    background: var(--confirm-color);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: background var(--trans-fast), transform var(--trans-fast), box-shadow var(--trans-fast);
    box-shadow: 0 4px 24px rgba(74, 158, 255, 0.28);
  }

  .confirm-btn:hover {
    background: var(--confirm-dark);
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(74, 158, 255, 0.38);
  }

  .confirm-btn:active { transform: translateY(0); }

  .confirm-btn:focus-visible {
    outline: 3px solid var(--confirm-color);
    outline-offset: 3px;
  }

  /* ── CONFIRMED state ─────────────────────────────────────── */
  #stage.confirmed {
    background: #071410;
  }

  .confirmed-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    opacity: 0;
    transition: opacity var(--trans-slow);
    pointer-events: none;
  }

  #stage.confirmed .confirmed-content {
    opacity: 1;
  }

  .confirmed-check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(34, 200, 128, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--calm-glow);
    font-size: 2rem;
  }

  .confirmed-text {
    font-size: 1.4rem;
    font-weight: 300;
    color: var(--calm-glow);
    letter-spacing: 0.02em;
  }

  .confirmed-sub {
    font-size: 0.85rem;
    color: var(--text-lo);
  }

  /* ── CONNECTING state ────────────────────────────────────── */
  .connecting-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    opacity: 0;
    transition: opacity var(--trans-slow);
    pointer-events: none;
  }

  #stage.connecting .connecting-content {
    opacity: 1;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border-subtle);
    border-top-color: var(--text-lo);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .connecting-label {
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-lo);
  }

  /* ── Status bar ──────────────────────────────────────────── */
  #statusbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border-subtle);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--text-lo);
    font-variant-numeric: tabular-nums;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-lo);
    display: inline-block;
    margin-right: 7px;
  }

  .status-dot.ok { background: var(--calm-glow); }
  .status-dot.err { background: var(--alarm-vivid); }

  /* ── Caregiver greeting ──────────────────────────────────── */
  #greeting {
    position: fixed;
    top: 18px;
    left: 24px;
    font-size: 0.75rem;
    color: var(--text-lo);
    letter-spacing: 0.04em;
    transition: color var(--trans-slow);
  }

  #stage.alarm #greeting { color: rgba(255,255,255,0.3); }

  /* ── Theme toggle ────────────────────────────────────────── */
  #theme-toggle {
    position: fixed;
    top: 14px;
    right: 20px;
    background: none;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-lo);
    cursor: pointer;
    transition: color var(--trans-fast), border-color var(--trans-fast);
  }

  #theme-toggle:hover { color: var(--text-mid); border-color: var(--text-lo); }
</style>

<!-- Greeting -->
<div id="greeting">Olá, Jamilly</div>

<!-- Theme toggle -->
<button id="theme-toggle" onclick="toggleTheme()">Tema</button>

<!-- Stage -->
<div id="stage" class="connecting">

  <!-- Connecting -->
  <div class="connecting-content" aria-live="polite">
    <div class="spinner"></div>
    <span class="connecting-label">Conectando ao serviço...</span>
  </div>

  <!-- Idle / monitoring -->
  <div class="idle-content" aria-live="polite" aria-label="Sistema monitorando, sem alertas">
    <div class="pulse-ring">
      <div class="pulse-dot"></div>
    </div>
    <span class="idle-label">Monitorando</span>
    <span class="idle-status">Nenhum alerta ativo</span>
    <span class="idle-name">Paciente: Márcio</span>
  </div>

  <!-- Alarm -->
  <div class="alarm-content" role="alert" aria-live="assertive">
    <div class="alarm-eyebrow">Emergência</div>
    <div class="alarm-verb">PRECISO<br>DE AJUDA</div>
    <div class="alarm-name" id="alarm-patient">Márcio</div>
    <div class="alarm-meta">
      <div class="meta-chip">
        <span class="meta-chip-label">Urgência</span>
        <span class="meta-chip-value" id="alarm-urgency">—</span>
      </div>
      <div class="meta-chip">
        <span class="meta-chip-label">Aguardando</span>
        <span class="meta-chip-value" id="alarm-elapsed">0s</span>
      </div>
      <div class="meta-chip">
        <span class="meta-chip-label">Gesto</span>
        <span class="meta-chip-value">Piscar duplo</span>
      </div>
    </div>
    <button class="confirm-btn" id="confirm-btn" onclick="confirmEvent()">
      ✓ &nbsp; Confirmar atendimento
    </button>
  </div>

  <!-- Confirmed -->
  <div class="confirmed-content" aria-live="polite">
    <div class="confirmed-check">✓</div>
    <div class="confirmed-text">Atendimento confirmado</div>
    <div class="confirmed-sub">Retornando ao monitoramento...</div>
  </div>

</div>

<!-- Status bar -->
<div id="statusbar">
  <div>
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Aguardando...</span>
  </div>
  <div id="status-time">—</div>
</div>

<script>
  const EVNT_BASE = 'http://localhost:8083/api/v1';
  const POLL_MS   = 2000;

  let currentState = 'connecting';
  let activeEventId = null;
  let alarmStart    = null;
  let elapsedTimer  = null;
  let pollTimer     = null;
  let audioCtx      = null;

  // ── Theme ──────────────────────────────────────────────────
  const root = document.documentElement;
  const savedTheme = localStorage.getItem('na-theme');
  if (savedTheme) root.setAttribute('data-theme', savedTheme);

  function toggleTheme() {
    const current = root.getAttribute('data-theme')
      || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('na-theme', next);
  }

  // ── State machine ──────────────────────────────────────────
  function setState(next) {
    if (currentState === next) return;
    currentState = next;
    const stage = document.getElementById('stage');
    stage.className = next;
  }

  // ── Status bar ─────────────────────────────────────────────
  function setStatus(connected, text) {
    const dot  = document.getElementById('status-dot');
    const span = document.getElementById('status-text');
    dot.className  = 'status-dot ' + (connected ? 'ok' : 'err');
    span.textContent = text;
    document.getElementById('status-time').textContent =
      new Date().toLocaleTimeString('pt-BR');
  }

  // ── Elapsed timer ──────────────────────────────────────────
  function startElapsed() {
    alarmStart = Date.now();
    clearInterval(elapsedTimer);
    elapsedTimer = setInterval(() => {
      const s = Math.floor((Date.now() - alarmStart) / 1000);
      const el = document.getElementById('alarm-elapsed');
      if (el) el.textContent = s < 60 ? s + 's' : Math.floor(s/60) + 'm ' + (s%60) + 's';
    }, 1000);
  }

  function stopElapsed() {
    clearInterval(elapsedTimer);
    elapsedTimer = null;
  }

  // ── Alarm sound (web audio — brief 880 Hz beep) ────────────
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.04);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.32);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.36);
    } catch (_) {}
  }

  // ── Poll ───────────────────────────────────────────────────
  async function poll() {
    try {
      const res = await fetch(EVNT_BASE + '/events/active', { signal: AbortSignal.timeout(4000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const event = data.activeEvent;

      if (event && event.feedback === 'NAO_AVALIADO') {
        setStatus(true, 'Alerta ativo — evento ' + event.id.slice(0, 8) + '…');
        if (currentState !== 'alarm') {
          activeEventId = event.id;
          document.getElementById('alarm-urgency').textContent =
            event.urgencia === 'EMERGENCIA' ? 'Emergência' : (event.urgencia || '—');
          startElapsed();
          beep();
          setState('alarm');
        }
      } else {
        if (currentState === 'alarm') stopElapsed();
        if (currentState !== 'confirmed') {
          activeEventId = null;
          setStatus(true, 'Sistema ativo — sem alertas');
          setState('idle');
        }
      }
    } catch (e) {
      if (currentState !== 'alarm') setState('connecting');
      setStatus(false, 'Sem conexão com o serviço');
    }
  }

  // ── Confirm ────────────────────────────────────────────────
  async function confirmEvent() {
    if (!activeEventId) return;
    const btn = document.getElementById('confirm-btn');
    btn.disabled = true;
    btn.textContent = 'Confirmando...';

    try {
      const res = await fetch(EVNT_BASE + '/events/' + activeEventId + '/confirmation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ verdict: 'real' }),
        signal: AbortSignal.timeout(5000)
      });

      if (res.ok) {
        stopElapsed();
        setState('confirmed');
        setStatus(true, 'Confirmado — retomando monitoramento');
        setTimeout(() => {
          activeEventId = null;
          btn.disabled = false;
          btn.textContent = '✓  Confirmar atendimento';
          setState('idle');
        }, 2800);
      } else {
        btn.disabled = false;
        btn.textContent = '✓  Confirmar atendimento';
        setStatus(false, 'Erro ao confirmar — tente novamente');
      }
    } catch {
      btn.disabled = false;
      btn.textContent = '✓  Confirmar atendimento';
      setStatus(false, 'Falha de rede ao confirmar');
    }
  }

  // ── Init ───────────────────────────────────────────────────
  document.addEventListener('click', () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true });

  poll();
  pollTimer = setInterval(poll, POLL_MS);
</script>
