spring:
  application:
    name: neuroassist-ai-api-gateway
  cloud:
    gateway:
      routes:
        # EDGE-INT-003: route /api/v1/edge/** to edge-service via Eureka load balancer.
        # POST /api/v1/edge/devices/enroll does NOT require Authorization (enrollmentToken auth).
        # All other edge endpoints require Bearer JWT validated upstream (resource server config).
        - id: edge-service-route
          uri: lb://edge-service
          predicates:
            - Path=/api/v1/edge/**
          filters:
            - RewritePath=/api/v1/edge/(?<segment>.*), /api/v1/edge/${segment}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${ACS_JWK_URI:http://localhost:8088/oauth2/jwks}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/neuroassist-ai}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
