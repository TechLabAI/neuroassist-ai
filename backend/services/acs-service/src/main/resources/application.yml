spring:
  application:
    name: acs-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false  # Migrations gerenciadas pelo neuroassist-ai-migrations (V7+)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/acs_dev}
    username: ${DB_USER:acs}
    password: ${DB_PASS:acs_dev_pass}
    hikari:
      maximum-pool-size: 10
  # OAuth2 Resource Server configured programmatically via JwtEncoderConfig (P2)
  # issuer-uri is NOT used — acs-service validates its own tokens via local RSA key
  cloud:
    openfeign:
      # NEVER use the legacy "feign.client.config" prefix — since Spring Cloud 2025.0.1 it is
      # silently ignored, leaving infinite timeouts.
      client:
        config:
          edge-service:
            connectTimeout: 2000
            readTimeout: 3000
      circuitbreaker:
        enabled: true
    loadbalancer:
      retry:
        enabled: true

server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

resilience4j:
  circuitbreaker:
    instances:
      mig-service:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
      pac-service:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
      hist-service:
        failure-rate-threshold: 100
        slow-call-duration-threshold: 1s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 5
  retry:
    instances:
      mig-service:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      pac-service:
        max-attempts: 2
        wait-duration: 500ms
  timelimiter:
    instances:
      mig-service:
        timeout-duration: 5s
      pac-service:
        timeout-duration: 2s
      hist-service:
        timeout-duration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

acs:
  jwt:
    # Access token TTL in seconds (default 15 min)
    expiry-seconds: ${ACS_JWT_EXPIRY_SECONDS:900}
    # Refresh token TTL in seconds (default 7 days)
    refresh-expiry-seconds: ${ACS_JWT_REFRESH_EXPIRY_SECONDS:604800}
  signing-key:
    # AES-256-GCM encryption secret for RSA private key storage.
    # REQUIRED in production: set ACS_SIGNING_KEY_SECRET env var.
    # Default "change-me-secret" is for local dev only — NEVER use in production.
    encryption-secret: ${ACS_SIGNING_KEY_SECRET:change-me-secret}

  # Service clients allowed at POST /oauth2/token/service (ACS-030).
  # Each entry grants a fixed authority set, embedded in a tenant-scoped token.
  # Service-to-service calls use these instead of propagating the caller's caregiver JWT —
  # that practice forced caregivers to hold hist:write and made the EDGE heartbeat
  # unreachable (plan-e2e-integration.md §11.2, C-18/C-19).
  #
  # secret-hash is a BCrypt hash, never a plaintext secret. A blank hash disables the
  # client (fail closed), so a missing env var rejects instead of accepting anything.
  # Dev default below is the BCrypt hash of "dev-service-secret" — NEVER use in production.
  service-clients:
    edge-service:
      secret-hash: ${EDGE_CLIENT_SECRET_HASH:$2a$10$KNH6nkRI8bwREw8Z.fGJHu/O3vPJBB0Z53ExWyaFPHwO5xzTR.LRm}
      authorities:
        # EDGE→GEST: profile pointer resolved during device heartbeat
        - gest.detection-profile.read
    pac-service:
      secret-hash: ${PAC_CLIENT_SECRET_HASH:$2a$10$KNH6nkRI8bwREw8Z.fGJHu/O3vPJBB0Z53ExWyaFPHwO5xzTR.LRm}
      authorities:
        # PAC→HIST: audit facts for comando lifecycle. hist-service applies the SCOPE_ prefix.
        - hist:write
    acs-service:
      secret-hash: ${ACS_CLIENT_SECRET_HASH:$2a$10$KNH6nkRI8bwREw8Z.fGJHu/O3vPJBB0Z53ExWyaFPHwO5xzTR.LRm}
      authorities:
        # ACS→EDGE: verificação de credencial de dispositivo em POST /oauth2/token/device.
        # Até aqui edge.internal era exigida por endpoints do EDGE e emitida por ninguém (C-18).
        - edge.internal
    evnt-service:
      secret-hash: ${EVNT_CLIENT_SECRET_HASH:$2a$10$KNH6nkRI8bwREw8Z.fGJHu/O3vPJBB0Z53ExWyaFPHwO5xzTR.LRm}
      authorities:
        # EVNT→ACS: quais cuidadores são responsáveis pelo paciente do evento.
        - acs.directory.read
        # EVNT→GEST: a primitiva reconhecida pelo report é conhecida? (mesmo caminho
        # que o PAC usa para a mesma pergunta — C-7; o endpoint de eligibility não
        # consegue respondê-la porque só avalia o catálogo do tenant por urgência).
        - gest.tipo-gesto.read
        # EVNT→PAC: snapshot do comando (rótulo + urgência) no momento do report.
        - pac.comando-lifecycle.read
        # EVNT→DASH: POST /internal/notifications. Até aqui SVC_EVNT era exigida pelo
        # NotificationDeliveryController e emitida por ninguém — mesma família do C-18.
        - SVC_EVNT
        # EVNT→HIST: evento.criado / evento.confirmado. hist-service aplica o prefixo SCOPE_.
        - hist:write
    dash-service:
      secret-hash: ${DASH_CLIENT_SECRET_HASH:$2a$10$KNH6nkRI8bwREw8Z.fGJHu/O3vPJBB0Z53ExWyaFPHwO5xzTR.LRm}
      authorities:
        # DASH→EVNT: callbacks de entrega (delivered / no-session / ack) e confirmação
        # proxiada do painel. O caregiverId viaja explícito no payload de cada chamada —
        # o DASH já autorizou o cuidador na sua própria borda /panel/**, e a autoridade
        # da chamada é o dash-service, não a pessoa (service-identity.md §4).
        - SVC_DASH

  # Identidade de serviço do PRÓPRIO acs-service (E2E-005).
  # Usada por EdgeInternalTokenProvider para chamar POST /internal/devices/verify-credential
  # no edge-service durante POST /oauth2/token/device. O segredo é validado contra o
  # hash BCrypt de acs.service-clients.acs-service — segredo ausente = falha fechada (401).
  service-identity:
    client-id: ${ACS_SERVICE_IDENTITY_CLIENT_ID:acs-service}
    client-secret: ${ACS_CLIENT_SECRET:dev-service-secret}
    # Renova o token cacheado esta margem (segundos) antes de expirar.
    refresh-margin-seconds: ${ACS_SERVICE_IDENTITY_REFRESH_MARGIN:60}

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
  level:
    com.neuroassist.acs: INFO
