spring:
  application:
    name: acs-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false  # Migrations gerenciadas pelo neuroassist-ai-migrations (V7+)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/acs_dev}
    username: ${DB_USER:acs}
    password: ${DB_PASS:acs_dev_pass}
    hikari:
      maximum-pool-size: 10
  # OAuth2 Resource Server configured programmatically via JwtEncoderConfig (P2)
  # issuer-uri is NOT used — acs-service validates its own tokens via local RSA key
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    loadbalancer:
      retry:
        enabled: true

server:
  port: 8088

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

resilience4j:
  circuitbreaker:
    instances:
      mig-service:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
      pac-service:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
      hist-service:
        failure-rate-threshold: 100
        slow-call-duration-threshold: 1s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 5
  retry:
    instances:
      mig-service:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      pac-service:
        max-attempts: 2
        wait-duration: 500ms
  timelimiter:
    instances:
      mig-service:
        timeout-duration: 5s
      pac-service:
        timeout-duration: 2s
      hist-service:
        timeout-duration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

acs:
  jwt:
    # Access token TTL in seconds (default 15 min)
    expiry-seconds: ${ACS_JWT_EXPIRY_SECONDS:900}
    # Refresh token TTL in seconds (default 7 days)
    refresh-expiry-seconds: ${ACS_JWT_REFRESH_EXPIRY_SECONDS:604800}
  signing-key:
    # AES-256-GCM encryption secret for RSA private key storage.
    # REQUIRED in production: set ACS_SIGNING_KEY_SECRET env var.
    # Default "change-me-secret" is for local dev only — NEVER use in production.
    encryption-secret: ${ACS_SIGNING_KEY_SECRET:change-me-secret}

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
  level:
    com.neuroassist.acs: INFO
