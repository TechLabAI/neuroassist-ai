# Profile 'test' — Testcontainers (PostgreSQL) + Artemis embedded.
# DataSource sobrescrito via @DynamicPropertySource em BaseIntegrationTest.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  artemis:
    mode: embedded
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json
eureka:
  client:
    enabled: false
dash:
  acs:
    base-url: http://localhost:0
  pac:
    base-url: http://localhost:0
  evnt:
    base-url: http://localhost:0
  hist:
    base-url: http://localhost:0
  edge:
    base-url: http://localhost:0
