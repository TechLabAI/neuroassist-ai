spring:
  application:
    name: dash-service
  # Zero tabelas MVP (ADR-004): sem datasource, sem JPA, sem Flyway
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/neuroassist-ai}

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics,sessions
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

dash:
  acs:
    base-url: ${ACS_BASE_URL:http://acs-service}
  pac:
    base-url: ${PAC_BASE_URL:http://pac-service}
  evnt:
    base-url: ${EVNT_BASE_URL:http://evnt-service}
  hist:
    base-url: ${HIST_BASE_URL:http://hist-service}
  edge:
    base-url: ${EDGE_BASE_URL:http://edge-service}

resilience4j:
  circuitbreaker:
    instances:
      acs-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      pac-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      evnt-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      hist-service:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      edge-service:
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 5
  timelimiter:
    instances:
      acs-service:
        timeoutDuration: 3s
      pac-service:
        timeoutDuration: 3s
      evnt-service:
        timeoutDuration: 2s
      hist-service:
        timeoutDuration: 5s
      edge-service:
        timeoutDuration: 2s

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
  level:
    com.neuroassist.dash: INFO
