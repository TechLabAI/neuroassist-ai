# Profile 'test' — Testcontainers (PostgreSQL) + Artemis embedded.
# DataSource sobrescrito via @DynamicPropertySource em BaseIntegrationTest.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  artemis:
    mode: embedded
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
