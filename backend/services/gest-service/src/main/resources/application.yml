spring:
  application:
    name: gest-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false  # Migrations gerenciadas pelo neuroassist-ai-migrations (V7+)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gest_dev}
    username: ${DB_USER:gest}
    password: ${DB_PASS:gest_dev_pass}
    hikari:
      maximum-pool-size: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${ACS_JWK_URI:http://localhost:8088/oauth2/jwks}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/neuroassist-ai}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      edgePairing:
        # "Dispositivo nao pareado" e resposta, nao queda. Sem esta linha o breaker contava cada
        # 404 como falha: tres dispositivos nao pareados seguidos abriam o circuito e passavam a
        # reportar "EDGE indisponivel" ate para os dispositivos pareados (C-19).
        ignoreExceptions:
          - com.neuroassist.gest.shared.error.DeviceNotPairedException
        # Sliding window: evaluate over the last 10 calls (COUNT_BASED)
        slidingWindowSize: 10
        # Minimum calls before the error rate is calculated (5 consecutive failures trigger the circuit)
        minimumNumberOfCalls: 5
        # Open circuit when failure rate reaches 50%
        failureRateThreshold: 50
        # Keep circuit open for 30s before transitioning to HALF_OPEN
        waitDurationInOpenState: 30s
        # Allow 3 probe calls in HALF_OPEN state before deciding to CLOSE or re-OPEN
        permittedNumberOfCallsInHalfOpenState: 3
        # Expose circuit breaker state via /actuator/health
        registerHealthIndicator: true
      # GEST -> EDGE: resolve device->paciente para projetar o perfil (E2E-034).
      edgeDevice:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        # Um 4xx e resposta, nao queda. Sem isto, um 403 de authority faltando abriria o breaker e
        # viraria "EDGE indisponivel" — um erro de permissao disfarcado de outage (C-19/C-37).
        ignoreExceptions:
          - feign.FeignException$FeignClientException
      # GEST -> PAC: catalogo ativo do paciente, de onde vem comando.sensibilidade.
      pacCatalog:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        ignoreExceptions:
          - feign.FeignException$FeignClientException
  retry:
    instances:
      edgePairing:
        # One retry before the circuit breaker counts a failure (GET is idempotent)
        maxAttempts: 2
        # Wait 100ms between attempts (avoids thundering-herd on transient glitches)
        waitDuration: 100ms
        # Only retry on transient connectivity failures (not on 4xx or domain errors)
        retryExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException

# Identidade de servico do GEST (E2E-034). Quem chama
# GET /detection-profile/devices/{id} e o EDGE, com um token que carrega apenas
# gest.detection-profile.read; propaga-lo ao EDGE ou ao PAC daria 403 — e um 403 dentro de um
# breaker vira "servico degradado", que foi o defeito C-19.
# Ver docs/architecture/backend/standards/service-identity.md
neuroassist:
  acs:
    service-token:
      url: ${ACS_SERVICE_URL:http://localhost:8088}
      client-id: ${GEST_CLIENT_ID:gest-service}
      client-secret: ${GEST_CLIENT_SECRET:dev-service-secret}
      refresh-margin-seconds: ${GEST_SERVICE_TOKEN_MARGIN_SECONDS:60}
      timeout-ms: ${GEST_SERVICE_TOKEN_TIMEOUT_MS:3000}
  pac:
    url: ${PAC_SERVICE_URL:http://pac-service:8082}

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
  level:
    com.neuroassist.gest: INFO
