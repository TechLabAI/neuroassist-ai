server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/neuroassist_poc
    username: neuroassist
    password: poc123
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: neuroassist_poc
    default-schema: neuroassist_poc
    locations: classpath:db/migration/poc
    table: flyway_evnt_history
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    properties:
      hibernate:
        default_schema: neuroassist_poc
    hibernate:
      ddl-auto: validate
    show-sql: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jms.artemis.ArtemisAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.jms.JmsHealthContributorAutoConfiguration

evnt:
  gest:
    baseurl: http://localhost:8082

eureka:
  client:
    enabled: false

logging:
  level:
    com.neuroassist.evnt: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
