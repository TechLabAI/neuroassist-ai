spring:
  application:
    name: evnt-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false  # Migrations gerenciadas pelo neuroassist-ai-migrations (V7+)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/evnt_dev}
    username: ${DB_USER:evnt}
    password: ${DB_PASS:evnt_dev_pass}
    hikari:
      maximum-pool-size: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${ACS_JWK_URI:http://localhost:8088/oauth2/jwks}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/neuroassist-ai}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

evnt:
  sse:
    keepalive-seconds: 15
    emitter-timeout-ms: 180000
  # Reenvio de notificacoes nao entregues (C-45).
  # Ate a Sessao 6 o retrySweep lancava UnsupportedOperationException e nao havia scheduler:
  # um dispatch QUEUED (DASH fora do ar) ou NO_SESSION (cuidadora sem painel aberto) ficava
  # assim para sempre — o alarme era duravel e nunca chegava a ninguem.
  dispatch-retry:
    enabled: true
    batch-size: 50
    max-attempts: 10        # depois disso o dispatch vai para FAILED e para de ser tentado
    initial-delay-ms: 30000
    # Curto de proposito: este intervalo e quanto tempo uma cuidadora que se ausentou espera
    # por um alarme que nao encontrou sessao aberta.
    interval-ms: 30000
  # Base URLs of the downstream services. The defaults are the docker-compose service names —
  # a `localhost` default resolves to the evnt-service container itself, which is how four of
  # these clients silently pointed at nothing (and two at the wrong service entirely).
  gest:
    baseurl: ${GEST_SERVICE_URL:http://gest-service:8084}
  acs:
    baseurl: ${ACS_SERVICE_URL:http://acs-service:8088}
  pac:
    baseurl: ${PAC_SERVICE_URL:http://pac-service:8082}
  dash:
    baseurl: ${DASH_SERVICE_URL:http://dash-service:8090}
  hist:
    baseurl: ${HIST_SERVICE_URL:http://hist-service:8089}

# Service identity (standards/service-identity.md). Every outbound call of evnt-service is the
# service acting on its own behalf — the device token that authenticated a report carries only
# `edge.device`, and propagating it downstream would be a guaranteed 403 (defect C-19).
neuroassist:
  service-identity:
    token-uri: ${ACS_SERVICE_URL:http://acs-service:8088}/oauth2/token/service
    client-id: ${EVNT_CLIENT_ID:evnt-service}
    client-secret: ${EVNT_CLIENT_SECRET:dev-service-secret}
    refresh-margin-seconds: 60
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - feign.FeignException
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.util.concurrent.TimeoutException
    instances:
      # GEST: fail-closed — invalid gesture blocks Evento creation
      gest-service:
        baseConfig: default
        minimumNumberOfCalls: 5
        failureRateThreshold: 100
        waitDurationInOpenState: 30s
      # PAC: command resolution — fail-closed on emergency path
      pac-service:
        baseConfig: default
        minimumNumberOfCalls: 5
        failureRateThreshold: 100
        waitDurationInOpenState: 30s
      # ACS: caregiver routing — fail-closed on emergency path
      acs-service:
        baseConfig: default
        minimumNumberOfCalls: 5
        failureRateThreshold: 100
        waitDurationInOpenState: 30s
      # DASH: notification delivery — fail-open; retry durable
      dash-service:
        baseConfig: default
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      # HIST: audit trail — not on critical path
      hist-service:
        baseConfig: default
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
  timelimiter:
    instances:
      gest-service:
        timeoutDuration: 3s
        cancelRunningFuture: true
      pac-service:
        timeoutDuration: 3s
        cancelRunningFuture: true
      acs-service:
        timeoutDuration: 3s
        cancelRunningFuture: true
      dash-service:
        timeoutDuration: 5s
        cancelRunningFuture: true
      hist-service:
        timeoutDuration: 5s
        cancelRunningFuture: true

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
  level:
    com.neuroassist.evnt: INFO
