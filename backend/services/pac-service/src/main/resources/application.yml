spring:
  application:
    name: pac-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false  # Migrations gerenciadas pelo neuroassist-ai-migrations (V7+)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pac_dev}
    username: ${DB_USER:pac}
    password: ${DB_PASS:pac_dev_pass}
    hikari:
      maximum-pool-size: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${ACS_JWK_URI:http://localhost:8088/oauth2/jwks}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/neuroassist-ai}
  cloud:
    openfeign:
      client:
        config:
          gest-service:
            connect-timeout: 2000
            read-timeout: 2000
          hist-service:
            connect-timeout: 2000
            read-timeout: 3000
          # E2E-015 — propagacao do vinculo cuidador-paciente para o directory do ACS.
          # Cliente separado de `acs-service` (AcsDirectoryClient) de proposito: este usa
          # identidade de servico e roda no dreno agendado; aquele propaga o token do chamador.
          # O read-timeout e maior porque o ACS resolve o paciente no PAC antes de gravar o
          # vinculo — a chamada volta para ca antes de responder.
          acs-service-link:
            connect-timeout: 2000
            read-timeout: 5000
          default:
            connect-timeout: 3000
            read-timeout: 5000

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{correlationId}] [%X{tenantId}] [%X{userId}] %logger{36} - %msg%n"
  level:
    com.neuroassist.pac: INFO

# INT-PAC-001 — GEST service integration (P5)
# INT-PAC-002 — ACS service integration (P4) — INT-PAC-006 (P8): url added for WireMock test override
# INT-PAC-003 — EDGE service integration (P4) — INT-PAC-006 (P8): url added for WireMock test override
# INT-PAC-004 — HIST service integration (P6)
neuroassist:
  integration:
    gest:
      url: ${GEST_SERVICE_URL:http://gest-service:8084}  # Eureka discovery via Spring Cloud
    acs:
      url: ${ACS_SERVICE_URL:http://acs-service:8088}    # Eureka discovery via Spring Cloud
    edge:
      url: ${EDGE_SERVICE_URL:http://edge-service:8087}  # Eureka discovery via Spring Cloud
    hist:
      url: ${HIST_SERVICE_URL:http://hist-service:8089}  # Eureka discovery via Spring Cloud

# Service identity (ADR / standards/service-identity.md) — PAC calls HIST as pac-service, not as
# the caregiver, so the CUIDADORA role no longer needs `hist:write`. Applied ONLY to HistFactClient.
# Secret is BCrypt-verified by ACS; `dev-service-secret` is the dev default and never for production.
  service-identity:
    token-uri: ${ACS_SERVICE_URL:http://acs-service:8088}/oauth2/token/service
    client-id: ${PAC_CLIENT_ID:pac-service}
    client-secret: ${PAC_CLIENT_SECRET:dev-service-secret}
    refresh-margin-seconds: 60      # re-mint 60s before expiry (service-identity.md §5)
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

# Dreno do outbox de fatos de auditoria (C-44).
# Ate a Sessao 6 nada lia `hist_outbox.status = 'pending'`: o comentario no adapter dizia
# "retry will handle it later" e o retry nao existia, entao um fato gravado com o hist-service
# fora do ar ficava na tabela para sempre.
  hist-outbox:
    batch-size: 50          # entradas por tick — evita replay de um backlog inteiro numa transacao
    max-retries: 10         # depois disso a entrada vai para 'failed' e para de ser tentada
    drain:
      enabled: true
      initial-delay-ms: 30000   # da tempo do hist-service subir junto no compose
      interval-ms: 60000

# Propagacao do vinculo cuidador-paciente para o directory do ACS (E2E-015 / C-30).
# O PAC gravava `paciente_cuidador` e parava ai, enquanto o ACS — que e quem o EVNT consulta
# para decidir quem recebe um alarme — lia outra tabela, em outro schema. Todo paciente criado
# pelo PAC nascia com directory vazio: alarme sem destinatario.
  directory-outbox:
    batch-size: 50          # o dreno para no primeiro erro transitorio; o lote so limita o tick
    max-retries: 10         # depois disso a entrada vai para 'failed' COM o motivo registrado
    drain:
      enabled: true
      initial-delay-ms: 30000   # da tempo do acs-service subir junto no compose
      interval-ms: 60000

# Resilience4j — Circuit Breaker for gest-service (INT-PAC-001 / SPEC-10 §4)
resilience4j:
  circuitbreaker:
    instances:
      gest-service:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50          # Open CB after 50% failures in the sliding window
        wait-duration-in-open-state: 30s    # Retry-After matches this (ADR-005)
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.lang.Exception             # Record all exceptions (fail-closed for emergency)
