# Profile 'test' — Testcontainers (PostgreSQL) + Artemis embedded.
# DataSource sobrescrito via @DynamicPropertySource em BaseIntegrationTest.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  artemis:
    mode: embedded
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json
eureka:
  client:
    enabled: false
# Stub URLs for Feign clients: Spring Cloud Feign validates url= at context load.
# Properties must be resolvable stubs (never called in BDD dry-run or ArchUnit).
neuroassist:
  integration:
    gest:
      url: http://localhost:19991
    acs:
      url: http://localhost:19992
    edge:
      url: http://localhost:19993
    hist:
      url: http://localhost:19994
