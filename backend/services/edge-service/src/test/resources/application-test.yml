# Profile 'test' — Testcontainers (PostgreSQL) + Artemis embedded.
# DataSource sobrescrito via @DynamicPropertySource em BaseIntegrationTest.
spring:
  jpa:
    hibernate:
      # P12: none — tabelas criadas manualmente em init-schema.sql para que
      # o multi-tenant schema-per-tenant funcione corretamente nos testes BDD.
      # create-drop com multi-tenancy nao cria tabelas no schema de tenant correto.
      ddl-auto: none
  flyway:
    enabled: false
  artemis:
    mode: embedded
  security:
    oauth2:
      resourceserver:
        jwt:
          # Apontado para WireMock quando nenhum JwtDecoder @Primary de test sobrescreve.
          # Com @TestConfiguration fornecendo @Primary JwtDecoder, esta URL nao e usada
          # (OAuth2ResourceServerJwtConfiguration e @ConditionalOnMissingBean).
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json
eureka:
  client:
    enabled: false
# D-532 pitfall fix: stub Feign client URLs so Spring context loads without malformed-URL error.
# Valor sobrescrito pelo @DynamicPropertySource em CucumberSpringContext para o WireMock real.
neuroassist:
  gest:
    url: http://localhost:8080
  acs:
    service-token:
      # URL sobrescrita para WireMock via @DynamicPropertySource (CucumberSpringContext).
      url: http://localhost:8080
      client-id: test-edge-service
      client-secret: test-secret
      refresh-margin-seconds: 0

# Resilience4j — high-threshold CB for tests so WireMock stubs never open the circuit (EDGE-014).
# threshold 100%/100-calls = circuit never opens during unit/integration tests.
# Para forcá-lo aberto em testes específicos: circuitBreakerRegistry.circuitBreaker("gest-detection-profile").transitionToOpenState()
resilience4j:
  circuitbreaker:
    instances:
      gest-detection-profile:
        sliding-window-size: 100
        minimum-number-of-calls: 100
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
