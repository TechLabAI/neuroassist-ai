spring:
  application:
    name: edge-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false  # Migrations gerenciadas pelo neuroassist-ai-migrations (V7+)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edge_dev}
    username: ${DB_USER:edge}
    password: ${DB_PASS:edge_dev_pass}
    hikari:
      maximum-pool-size: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${ACS_JWK_URI:http://localhost:8088/oauth2/jwks}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/neuroassist-ai}

server:
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      module: EDGE

info:
  app:
    version: 0.0.1-SNAPSHOT
    module: EDGE
    description: "edge-service — Device authority microservice"

logging:
  level:
    com.neuroassist.edge: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

neuroassist:
  edge:
    heartbeat:
      interval-seconds: 30
      staleness-factor: 3
    enrollment:
      ttl-seconds: 900
    liveness:
      poll-hint-seconds: 15
  gest:
    url: ${GEST_URL:lb://gest-service}
  acs:
    # Endpoint anunciado ao dispositivo no enroll, para ele trocar a credencial por um token
    # com a authority edge.device. O default apontava para um Keycloak que não existe neste
    # stack — ver service-identity.md §7 (C-18).
    token-endpoint: ${ACS_TOKEN_ENDPOINT:http://localhost:8088/oauth2/token/device}
    # Service identity (EDGE -> GEST): POST {url}/oauth2/token/service
    # See docs/architecture/backend/standards/service-identity.md
    service-token:
      url: ${ACS_SERVICE_URL:http://localhost:8088}
      client-id: ${EDGE_CLIENT_ID:edge-service}
      client-secret: ${EDGE_CLIENT_SECRET:dev-service-secret}
      refresh-margin-seconds: ${EDGE_SERVICE_TOKEN_MARGIN_SECONDS:60}
      timeout-ms: ${EDGE_SERVICE_TOKEN_TIMEOUT_MS:3000}

# Resilience4j — circuit breakers for external integrations (EDGE-014)
resilience4j:
  circuitbreaker:
    instances:
      gest-detection-profile:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
