# Profile 'local' — desenvolvimento local com mocks de plataforma
# P5: use jwk-set-uri (lazy fetch) instead of issuer-uri (eager OIDC discovery) so the service
# starts even when ACS/Keycloak is temporarily unavailable. JWT validation still happens on the
# first request; startup does NOT require ACS to be reachable.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/neuroassist-ai/protocol/openid-connect/certs}
  datasource:
    url: jdbc:postgresql://localhost:5432/edge_dev
    username: edge
    password: edge_dev_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: t_emp_dev
  flyway:
    enabled: false  # schema gerenciado pelo neuroassist-ai-migrations
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

# Desabilita autenticação real com a plataforma no profile local
platform:
  identity:
    mock: true
    mock-user-id: user-dev-001
    mock-user-name: Desenvolvedor Local
    mock-roles:
      - EDGE_OPERATOR  # role principal da tool
  tenant:
    mock: true
    mock-tenant-id: tenant-dev
    mock-organization-id: org-dev-001
  authorization:
    mock: true
    mock-permit-all: true

logging:
  level:
    com.neuroassist.edge: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
