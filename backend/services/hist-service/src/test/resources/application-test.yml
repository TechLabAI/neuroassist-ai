# Profile 'test' — Testcontainers (PostgreSQL) + Artemis embedded.
# DataSource sobrescrito via @DynamicPropertySource em BaseIntegrationTest.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  artemis:
    mode: embedded
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json
eureka:
  client:
    enabled: false

# Feign timeouts — explicit for test profile so the AcsIntegrationTest timeout scenario works
# even when the named client config from application.yml is not applied to URL-based clients.
feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 2000
      acs-directory:
        connectTimeout: 2000
        readTimeout: 2000
