# nginx.conf — neuroassist-ai-web (container `web` do docker-compose.dev.yml)
#
# Responsabilidades:
#   1. servir o bundle Angular com fallback de SPA (base href = "/")
#   2. encaminhar /api/** e /oauth2/** para o gateway (:8080 na rede do compose)
#
# O upstream é resolvido em runtime via DNS do Docker (127.0.0.11) — com o nome
# em variável, o nginx não morre no boot caso o gateway ainda não esteja de pé.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream "gateway:8080";

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck do container (não passa pelo gateway)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API do backend ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;          # SSE/streaming (dash-service) passa sem buffer
    }

    # ── OAuth2 / OIDC (acs-service via gateway) ───────────────────────────────
    location /oauth2/ {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Estáticos com hash no nome: cache longo ───────────────────────────────
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
