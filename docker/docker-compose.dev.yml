# docker-compose.dev.yml — Stack completo NeuroAssist AI para validação E2E local
#
# PRÉ-REQUISITO: build dos JARs antes de subir
#   cd backend && ./gradlew bootJar -x test
#
# USO:
#   docker compose -f docker/docker-compose.dev.yml up -d
#   docker compose -f docker/docker-compose.dev.yml logs -f <service>
#   docker compose -f docker/docker-compose.dev.yml down -v
#
# FRONTEND: a imagem é construída pelo próprio compose (não precisa de npm local)
#   docker compose -f docker/docker-compose.dev.yml up -d --build web  → http://localhost:14200
#
# NOTA DE PORTAS (conflitos com ambiente local):
#   postgres   → host 5433 (5432 = techlab-framework-pgvector)
#   registry   → host 18761 (8761 = Eureka local em execução)
#   web        → host 14200 (4200 = `nx serve` local em execução)
#
# ORDEM DE STARTUP (gerenciada por depends_on + healthchecks):
#   postgres + activemq → migrations-global → migrations-empresa →
#   registry → acs-service → [gest, evnt, pac, edge, hist, dash] → gateway → web

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRAESTRUTURA
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16
    container_name: neuroassist-postgres
    environment:
      POSTGRES_DB: neuroassist_dev
      POSTGRES_USER: neuroassist
      POSTGRES_PASSWORD: neuroassist_dev_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroassist -d neuroassist_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  activemq:
    image: apache/activemq-artemis:2.39.0
    container_name: neuroassist-activemq
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8161/console/auth/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # MIGRATIONS — rodam e encerram
  # SPRING_PROFILES_ACTIVE=docker impede application-default.yml (flyway disabled)
  # ═══════════════════════════════════════════════════════════════════════════

  migrations-global:
    image: eclipse-temurin:21-jre-alpine
    container_name: neuroassist-migrations-global
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/neuroassist-ai-migrations/build/libs/neuroassist-ai-migrations-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FLYWAY_URL: jdbc:postgresql://postgres:5432/neuroassist_dev
      FLYWAY_USER: neuroassist
      FLYWAY_PASSWORD: neuroassist_dev_pass
      FLYWAY_LOCATIONS: classpath:db/migration/global
      FLYWAY_SCHEMAS: neuroassist_global
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  migrations-empresa:
    image: eclipse-temurin:21-jre-alpine
    container_name: neuroassist-migrations-empresa
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/neuroassist-ai-migrations/build/libs/neuroassist-ai-migrations-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FLYWAY_URL: jdbc:postgresql://postgres:5432/neuroassist_dev
      FLYWAY_USER: neuroassist
      FLYWAY_PASSWORD: neuroassist_dev_pass
      FLYWAY_LOCATIONS: classpath:db/migration/empresa
      FLYWAY_SCHEMAS: t_emp_dev
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    depends_on:
      migrations-global:
        condition: service_completed_successfully
    restart: on-failure

  # ═══════════════════════════════════════════════════════════════════════════
  # MIG API — face HTTP interna do neuroassist-ai-migrations :8091 (E2E-016)
  #
  # Mesmo jar dos dois conteineres acima, outra face. Aqueles rodam ate o fim e
  # SAEM (o `depends_on: service_completed_successfully` conta com isso); este
  # fica de pe para o acs-service chamar no onboarding de empresa. O que separa
  # os dois e o profile `api`, que promove o processo a servlet e desliga o
  # Flyway de startup.
  #
  # Nao e roteado pelo gateway e nao fica sob /api/**: e superficie interna
  # (api-contract §1). A porta e publicada so para diagnostico local.
  # ═══════════════════════════════════════════════════════════════════════════

  migrations-api:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-migrations-api
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/neuroassist-ai-migrations/build/libs/neuroassist-ai-migrations-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker,api
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/neuroassist_dev
      SPRING_DATASOURCE_USERNAME: neuroassist
      SPRING_DATASOURCE_PASSWORD: neuroassist_dev_pass
      # O MIG so VALIDA o token; quem assina e o acs-service.
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      MIG_GLOBAL_SCHEMA: neuroassist_global
      MIG_TENANT_LOCATIONS: classpath:db/migration/empresa
      # A role que o V0006 do template de empresa referencia.
      HIST_SERVICE_ROLE: neuroassist
    healthcheck:
      # Checagem TCP via bash, e nao `curl`: a imagem jre nao traz curl, e instala-lo no
      # `command` faria a subida depender de rede de pacotes — um healthcheck que falha por
      # falta da propria ferramenta de checagem diz menos que nenhum.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8091' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      migrations-empresa:
        condition: service_completed_successfully
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # SERVICE REGISTRY — Eureka :8761 (interno) / :18761 (host)
  # ═══════════════════════════════════════════════════════════════════════════

  registry:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-registry
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/neuroassist-ai-service-registry/build/libs/neuroassist-ai-service-registry-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "18761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # ACS — OAuth2 Authorization Server :8088
  # ═══════════════════════════════════════════════════════════════════════════

  acs-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-acs-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/acs-service/build/libs/acs-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
      ACS_SIGNING_KEY_SECRET: "e2e-dev-secret-change-in-production"
      # E2E-016 — provisionamento de schema no onboarding de empresa. Sem esta variavel o
      # default do Feign resolveria `migrations-api` de dentro do proprio conteiner.
      MIG_SERVICE_URL: http://migrations-api:8091
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      migrations-empresa:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
      activemq:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # SERVIÇOS DE DOMÍNIO — validam JWT via KEYCLOAK_ISSUER_URI → acs-service
  # ═══════════════════════════════════════════════════════════════════════════

  gest-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-gest-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/gest-service/build/libs/gest-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8084:8084"
    environment:
      # GEST→EDGE: resolução device→tenant antes de servir o ponteiro de perfil.
      EDGE_SERVICE_URL: http://edge-service:8087
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  evnt-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-evnt-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/evnt-service/build/libs/evnt-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "18085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      # Downstream services. A localhost default resolves to the evnt-service container itself.
      ACS_SERVICE_URL: http://acs-service:8088
      GEST_SERVICE_URL: http://gest-service:8084
      PAC_SERVICE_URL: http://pac-service:8082
      DASH_SERVICE_URL: http://dash-service:8090
      HIST_SERVICE_URL: http://hist-service:8089
      # Service identity — matches the BCrypt hash of acs.service-clients.evnt-service
      EVNT_CLIENT_ID: evnt-service
      EVNT_CLIENT_SECRET: dev-service-secret
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  pac-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-pac-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/pac-service/build/libs/pac-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      # Service identity (standards/service-identity.md): PAC → HIST travels on pac-service's own
      # token (hist:write), not on the caregiver's. ACS validates the secret against its BCrypt hash.
      ACS_SERVICE_URL: http://acs-service:8088
      PAC_CLIENT_ID: pac-service
      PAC_CLIENT_SECRET: dev-service-secret
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  edge-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-edge-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/edge-service/build/libs/edge-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
      ACS_TOKEN_ENDPOINT: http://acs-service:8088/oauth2/token/device
      # Service identity EDGE -> GEST (service-identity.md); secret is dev-only
      ACS_SERVICE_URL: http://acs-service:8088
      EDGE_CLIENT_ID: edge-service
      EDGE_CLIENT_SECRET: ${EDGE_CLIENT_SECRET:-dev-service-secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  hist-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-hist-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/hist-service/build/libs/hist-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      ACS_SERVICE_URL: http://acs-service:8088
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8089/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  dash-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-dash-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/dash-service/build/libs/dash-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "18090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      ACS_BASE_URL: http://acs-service:8088
      PAC_BASE_URL: http://pac-service:8082
      EVNT_BASE_URL: http://evnt-service:8085
      HIST_BASE_URL: http://hist-service:8089
      EDGE_BASE_URL: http://edge-service:8087
      # Service identity — matches the BCrypt hash of acs.service-clients.dash-service
      DASH_CLIENT_ID: dash-service
      DASH_CLIENT_SECRET: dev-service-secret
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # API GATEWAY — :8080 (último a subir)
  # ═══════════════════════════════════════════════════════════════════════════

  gateway:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-gateway
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/neuroassist-ai-api-gateway/build/libs/neuroassist-ai-api-gateway-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      registry:
        condition: service_healthy
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # FRONTEND — neuroassist-ai-web (Angular + nginx) :14200 (host) / :80
  # Bundle estático + proxy /api e /oauth2 → gateway:8080 (ver frontend/nginx.conf)
  # ════════════════════════════════════════════════════════════════════════════

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: neuroassist/web:dev
    container_name: neuroassist-web
    ports:
      - "14200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════

volumes:
  postgres-data:
    name: neuroassist-postgres-data
