# docker-compose.dev.yml — Stack completo NeuroAssist AI para validação E2E local
#
# PRÉ-REQUISITO: build dos JARs antes de subir
#   cd backend && ./gradlew bootJar -x test
#
# USO:
#   docker compose -f docker/docker-compose.dev.yml up -d
#   docker compose -f docker/docker-compose.dev.yml logs -f <service>
#   docker compose -f docker/docker-compose.dev.yml down -v
#
# NOTA DE PORTAS (conflitos com ambiente local):
#   postgres   → host 5433 (5432 = techlab-framework-pgvector)
#   registry   → host 18761 (8761 = Eureka local em execução)
#
# ORDEM DE STARTUP (gerenciada por depends_on + healthchecks):
#   postgres + activemq → migrations-global → migrations-empresa →
#   registry → acs-service → [gest, evnt, pac, edge, hist, dash] → gateway

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRAESTRUTURA
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16
    container_name: neuroassist-postgres
    environment:
      POSTGRES_DB: neuroassist_dev
      POSTGRES_USER: neuroassist
      POSTGRES_PASSWORD: neuroassist_dev_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroassist -d neuroassist_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  activemq:
    image: apache/activemq-artemis:2.39.0
    container_name: neuroassist-activemq
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8161/console/auth/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # MIGRATIONS — rodam e encerram
  # SPRING_PROFILES_ACTIVE=docker impede application-default.yml (flyway disabled)
  # ═══════════════════════════════════════════════════════════════════════════

  migrations-global:
    image: eclipse-temurin:21-jre-alpine
    container_name: neuroassist-migrations-global
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/neuroassist-ai-migrations/build/libs/neuroassist-ai-migrations-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FLYWAY_URL: jdbc:postgresql://postgres:5432/neuroassist_dev
      FLYWAY_USER: neuroassist
      FLYWAY_PASSWORD: neuroassist_dev_pass
      FLYWAY_LOCATIONS: classpath:db/migration/global
      FLYWAY_SCHEMAS: neuroassist_global
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  migrations-empresa:
    image: eclipse-temurin:21-jre-alpine
    container_name: neuroassist-migrations-empresa
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/neuroassist-ai-migrations/build/libs/neuroassist-ai-migrations-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FLYWAY_URL: jdbc:postgresql://postgres:5432/neuroassist_dev
      FLYWAY_USER: neuroassist
      FLYWAY_PASSWORD: neuroassist_dev_pass
      FLYWAY_LOCATIONS: classpath:db/migration/empresa
      FLYWAY_SCHEMAS: t_emp_dev
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    depends_on:
      migrations-global:
        condition: service_completed_successfully
    restart: on-failure

  # ═══════════════════════════════════════════════════════════════════════════
  # SERVICE REGISTRY — Eureka :8761 (interno) / :18761 (host)
  # ═══════════════════════════════════════════════════════════════════════════

  registry:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-registry
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/neuroassist-ai-service-registry/build/libs/neuroassist-ai-service-registry-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "18761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # ACS — OAuth2 Authorization Server :8088
  # ═══════════════════════════════════════════════════════════════════════════

  acs-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-acs-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/acs-service/build/libs/acs-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
      ACS_SIGNING_KEY_SECRET: "e2e-dev-secret-change-in-production"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      migrations-empresa:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
      activemq:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # SERVIÇOS DE DOMÍNIO — validam JWT via KEYCLOAK_ISSUER_URI → acs-service
  # ═══════════════════════════════════════════════════════════════════════════

  gest-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-gest-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/gest-service/build/libs/gest-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  evnt-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-evnt-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/evnt-service/build/libs/evnt-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "18085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  pac-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-pac-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/pac-service/build/libs/pac-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      # Service identity (standards/service-identity.md): PAC → HIST travels on pac-service's own
      # token (hist:write), not on the caregiver's. ACS validates the secret against its BCrypt hash.
      ACS_SERVICE_URL: http://acs-service:8088
      PAC_CLIENT_ID: pac-service
      PAC_CLIENT_SECRET: dev-service-secret
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  edge-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-edge-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/edge-service/build/libs/edge-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
      ACS_TOKEN_ENDPOINT: http://acs-service:8088/oauth2/token/device
      # Service identity EDGE -> GEST (service-identity.md); secret is dev-only
      ACS_SERVICE_URL: http://acs-service:8088
      EDGE_CLIENT_ID: edge-service
      EDGE_CLIENT_SECRET: ${EDGE_CLIENT_SECRET:-dev-service-secret}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  hist-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-hist-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/hist-service/build/libs/hist-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      ACS_SERVICE_URL: http://acs-service:8088
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8089/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  dash-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-dash-service
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/dash-service/build/libs/dash-service-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "18090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/neuroassist_dev?currentSchema=t_emp_dev,neuroassist_global
      DB_USER: neuroassist
      DB_PASS: neuroassist_dev_pass
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
      SPRING_ARTEMIS_MODE: native
      SPRING_ARTEMIS_BROKER_URL: tcp://activemq:61616
      SPRING_ARTEMIS_USER: admin
      SPRING_ARTEMIS_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      acs-service:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # API GATEWAY — :8080 (último a subir)
  # ═══════════════════════════════════════════════════════════════════════════

  gateway:
    image: eclipse-temurin:21-jre-jammy
    container_name: neuroassist-gateway
    command: java -jar /app/app.jar
    volumes:
      - ../backend/services/neuroassist-ai-api-gateway/build/libs/neuroassist-ai-api-gateway-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URI: http://registry:8761/eureka
      KEYCLOAK_ISSUER_URI: http://acs-service:8088
      ACS_JWK_URI: http://acs-service:8088/oauth2/jwks
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    depends_on:
      registry:
        condition: service_healthy
      acs-service:
        condition: service_healthy
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════

volumes:
  postgres-data:
    name: neuroassist-postgres-data
